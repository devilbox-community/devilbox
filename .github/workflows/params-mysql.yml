---

# -------------------------------------------------------------------------------------------------
# Job Name
# -------------------------------------------------------------------------------------------------
name: params


# -------------------------------------------------------------------------------------------------
# Custom Variables
# -------------------------------------------------------------------------------------------------
env:
  # mysql-9.7 and percona-9.7 are left out until docker-compose.yml uses php-fpm 0.161 or newer:
  # older images ship the mysql CLI without the caching_sha2_password plugin that 9.x requires.
  MATRIX: >-
    [
      {"MYSQL_SERVER": "mysql-5.5"},
      {"MYSQL_SERVER": "mysql-5.6"},
      {"MYSQL_SERVER": "mysql-5.7"},
      {"MYSQL_SERVER": "mysql-8.0"},
      {"MYSQL_SERVER": "mysql-8.4"},
      {"MYSQL_SERVER": "percona-5.5"},
      {"MYSQL_SERVER": "percona-5.6"},
      {"MYSQL_SERVER": "percona-5.7"},
      {"MYSQL_SERVER": "percona-8.0"},
      {"MYSQL_SERVER": "percona-8.4"},
      {"MYSQL_SERVER": "mariadb-5.5"},
      {"MYSQL_SERVER": "mariadb-10.0"},
      {"MYSQL_SERVER": "mariadb-10.1"},
      {"MYSQL_SERVER": "mariadb-10.2"},
      {"MYSQL_SERVER": "mariadb-10.3"},
      {"MYSQL_SERVER": "mariadb-10.4"},
      {"MYSQL_SERVER": "mariadb-10.5"},
      {"MYSQL_SERVER": "mariadb-10.6"},
      {"MYSQL_SERVER": "mariadb-10.7"},
      {"MYSQL_SERVER": "mariadb-10.8"},
      {"MYSQL_SERVER": "mariadb-10.9"},
      {"MYSQL_SERVER": "mariadb-10.10"},
      {"MYSQL_SERVER": "mariadb-10.11"},
      {"MYSQL_SERVER": "mariadb-11.4"},
      {"MYSQL_SERVER": "mariadb-11.8"},
      {"MYSQL_SERVER": "mariadb-12.3"}
    ]


# -------------------------------------------------------------------------------------------------
# When to run
# -------------------------------------------------------------------------------------------------
on:
  workflow_call:
    outputs:
      matrix:
        description: "The determined version matrix"
        value: ${{ jobs.params.outputs.matrix }}

jobs:
  params:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: "[Set-Output] Matrix"
        id: set-matrix
        run: |
          echo "matrix=$( echo '${{ env.MATRIX }}' | jq -M -c )" >> $GITHUB_OUTPUT

      - name: "[DEBUG] Show settings"
        run: |
          echo 'Matrix'
          echo '--------------------'
          echo '${{ steps.set-matrix.outputs.matrix }}'
          echo
