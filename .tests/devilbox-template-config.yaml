---
# .devilbox.yaml
# This file is used to automate the initialization of webapps for the Devilbox.
# Repository: https://github.com/devilbox-community/devilbox
#
#:-version: v1

apps:
  - name: ${app_name}
    is_subdomain: ${is_subdomain}
stack: ${current_stack}
infra: ${infra_type}
repo: ${repo_url}
php:
  version: ${php_version}
proxy:
  port: ${proxy_port}
